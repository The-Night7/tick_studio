[package]
name = "tick_studio"
version = "0.1.0"
edition = "2024"

[dependencies]
egui = "0.36.0"
eframe = { version = "0.36.0" }
tokio = { version = "1.53.1", features = ["full"] }
parking_lot = "0.12.4"
ytd-rs = "0.2.1"
egui_extras = { version = "*", features = ["all_loaders"] }
image = { version = "0.25", features = ["jpeg", "png"] }
jiff = "0.2.35"
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
serde_cursor = "0.4.0"
rfd = "0.17.2"
egui_material_icons = "0.8.0"
encoding_rs = "0.8"

[profile.dev.package."*"]
opt-level = 3